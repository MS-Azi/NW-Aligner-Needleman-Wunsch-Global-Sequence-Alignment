<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧬 Needleman-Wunsch Aligner</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ══════════════════════════════════════════
       CSS CUSTOM PROPERTIES
    ══════════════════════════════════════════ */
    :root {
      --accent: #7c3aed;
      --accent-rgb: 124, 58, 237;

      /* Light theme */
      --bg:        #f0ecff;
      --surface:   #ffffff;
      --surface-2: #f5f3ff;
      --text:      #1a1033;
      --text-muted:#6b7280;
      --border:    #e2ddf7;
      --shadow-sm: 0 2px 8px rgba(124,58,237,.08);
      --shadow-md: 0 8px 28px rgba(124,58,237,.13);
    }

    [data-theme="dark"] {
      --bg:        #0d0b14;
      --surface:   #1a1528;
      --surface-2: #231d38;
      --text:      #f0ecff;
      --text-muted:#9ca3af;
      --border:    #2d2645;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
      --shadow-md: 0 8px 28px rgba(0,0,0,.45);
    }

    /* ══════════════════════════════════════════
       RESET & BASE
    ══════════════════════════════════════════ */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background .3s, color .3s;
    }

    .hidden { display: none !important; }

    /* ══════════════════════════════════════════
       HEADER
    ══════════════════════════════════════════ */
    .site-header {
      background: rgba(var(--accent-rgb), 1);
      padding: .9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 24px rgba(var(--accent-rgb),.35);
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .brand-icon {
      font-size: 2.1rem;
      animation: float 3.5s ease-in-out infinite;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.25));
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    .brand-text h1 {
      font-size: 1.35rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -.4px;
      text-shadow: 0 2px 8px rgba(0,0,0,.2);
      line-height: 1.1;
    }

    .brand-text p {
      font-size: .72rem;
      color: rgba(255,255,255,.8);
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: .55rem;
    }

    .ctrl-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }

    .ctrl-btn:hover {
      background: rgba(255,255,255,.3);
      border-color: rgba(255,255,255,.55);
      transform: scale(1.1) rotate(-8deg);
    }

    /* Color picker sits behind the emoji button */
    .color-wrap {
      position: relative;
      width: 40px;
      height: 40px;
    }

    .color-wrap input[type="color"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      border: none;
      padding: 0;
    }

    .color-wrap .ctrl-btn {
      pointer-events: none;
      position: relative;
    }

    /* ══════════════════════════════════════════
       MAIN LAYOUT
    ══════════════════════════════════════════ */
    main {
      flex: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ══════════════════════════════════════════
       CARDS
    ══════════════════════════════════════════ */
    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 1.75rem 2rem;
      box-shadow: var(--shadow-md);
      border: 1.5px solid var(--border);
      transition: background .3s, border-color .3s;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .card-title .ti { font-size: 1.3rem; }

    /* ══════════════════════════════════════════
       INPUT SECTION
    ══════════════════════════════════════════ */
    .seq-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: .35rem;
    }

    .field-label {
      font-size: .8rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      display: flex;
      align-items: center;
      gap: .3rem;
    }

    .field-input {
      width: 100%;
      padding: .72rem 1rem;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      transition: border-color .2s, box-shadow .2s;
    }

    .field-input::placeholder {
      font-weight: 500;
      letter-spacing: 0;
      color: var(--text-muted);
    }

    .field-input:focus {
      outline: none;
      border-color: rgba(var(--accent-rgb), .6);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .12);
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.1rem;
    }

    .score-field {
      width: 100%;
      padding: .65rem .5rem;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      text-align: center;
      transition: border-color .2s, box-shadow .2s;
    }

    .score-field:focus {
      outline: none;
      border-color: rgba(var(--accent-rgb), .6);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .12);
    }

    .seq-type-badge {
      text-align: center;
      font-size: .78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 1.1rem;
      padding: .5rem 1rem;
      background: rgba(var(--accent-rgb), .07);
      border-radius: 50px;
    }

    /* ══════════════════════════════════════════
       ALIGN BUTTON
    ══════════════════════════════════════════ */
    .align-btn {
      width: 100%;
      padding: .9rem 2rem;
      border-radius: 50px;
      border: none;
      background: linear-gradient(
        135deg,
        rgba(var(--accent-rgb), 1) 0%,
        rgba(var(--accent-rgb), .75) 100%
      );
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: .5px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(var(--accent-rgb), .4);
      transition: transform .2s, box-shadow .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
    }

    .align-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(var(--accent-rgb), .5);
    }

    .align-btn:active:not(:disabled) { transform: translateY(0); }

    .align-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* ══════════════════════════════════════════
       ERROR
    ══════════════════════════════════════════ */
    .error-box {
      background: #fef2f2;
      border: 2px solid #fca5a5;
      border-radius: 16px;
      padding: 1rem 1.25rem;
      color: #dc2626;
      font-weight: 700;
      font-size: .9rem;
      display: flex;
      align-items: flex-start;
      gap: .6rem;
    }

    [data-theme="dark"] .error-box {
      background: #2d1515;
      border-color: #7f1d1d;
      color: #fca5a5;
    }

    /* ══════════════════════════════════════════
       LOADING
    ══════════════════════════════════════════ */
    .loading-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(var(--accent-rgb), .2);
      border-top-color: rgba(var(--accent-rgb), 1);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══════════════════════════════════════════
       MATRIX TABLE
    ══════════════════════════════════════════ */
    .matrix-scroll {
      overflow: auto;
      max-height: 580px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
    }

    .nw-table {
      border-collapse: collapse;
      min-width: max-content;
    }

    .nw-table th,
    .nw-table td {
      min-width: 44px;
      height: 44px;
      text-align: center;
      font-size: .8rem;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    /* corner + header labels */
    .nw-table .th-corner {
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .nw-table .th-seq {
      background: rgba(var(--accent-rgb), .12);
      color: rgba(var(--accent-rgb), 1);
      font-size: .88rem;
      font-weight: 900;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .nw-table .td-row-label {
      background: rgba(var(--accent-rgb), .12);
      color: rgba(var(--accent-rgb), 1);
      font-size: .88rem;
      font-weight: 900;
      position: sticky;
      left: 0;
      z-index: 1;
    }

    /* data cells */
    .nw-table .td-cell {
      background: var(--surface);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: .8rem;
    }

    /* traceback highlight */
    .nw-table .td-path {
      background: rgba(var(--accent-rgb), .18) !important;
      color: rgba(var(--accent-rgb), 1) !important;
      font-weight: 900 !important;
      box-shadow:
        inset 0 0 0 2px rgba(var(--accent-rgb), .75),
        0 0 10px rgba(var(--accent-rgb), .3);
      position: relative;
      z-index: 0;
      animation: traceGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes traceGlow {
      from { box-shadow: inset 0 0 0 2px rgba(var(--accent-rgb),.5); }
      to   { box-shadow: inset 0 0 0 2.5px rgba(var(--accent-rgb),.9),
                         0 0 14px rgba(var(--accent-rgb),.4); }
    }

    /* origin cell */
    .nw-table .td-origin {
      background: rgba(var(--accent-rgb), .32) !important;
    }

    /* ══════════════════════════════════════════
       LEGEND
    ══════════════════════════════════════════ */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-top: 1.1rem;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .78rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .ld-path     { background: rgba(var(--accent-rgb),.3); border: 1.5px solid rgba(var(--accent-rgb),1); }
    .ld-match    { background: rgba(16,185,129,.25);  border: 1.5px solid #059669; }
    .ld-mismatch { background: rgba(245,158,11,.25);  border: 1.5px solid #d97706; }
    .ld-gap      { background: rgba(239,68,68,.2);    border: 1.5px solid #dc2626; }

    /* ══════════════════════════════════════════
       RESULTS SECTION
    ══════════════════════════════════════════ */
    .score-hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 1.25rem 1rem;
      background: rgba(var(--accent-rgb), .08);
      border-radius: 18px;
      margin-bottom: 1.25rem;
    }

    .score-label {
      font-size: .82rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .score-value {
      font-size: 2.8rem;
      font-weight: 900;
      color: rgba(var(--accent-rgb), 1);
      text-shadow: 0 2px 16px rgba(var(--accent-rgb), .35);
      line-height: 1;
    }

    /* stats chips */
    .stats-row {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .stat-chip {
      flex: 1;
      min-width: 100px;
      padding: .8rem .75rem;
      background: var(--surface-2);
      border-radius: 14px;
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .15rem;
    }

    .stat-num   { font-size: 1.45rem; font-weight: 900; color: rgba(var(--accent-rgb),1); line-height: 1; }
    .stat-lbl   { font-size: .68rem;  font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }

    /* alignment visualization */
    .align-display {
      background: var(--surface-2);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
      border: 1.5px solid var(--border);
    }

    .align-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .35rem;
    }

    .align-row:last-child { margin-bottom: 0; }

    .row-lbl {
      min-width: 58px;
      font-size: .72rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      text-align: right;
      flex-shrink: 0;
    }

    .char-list {
      display: flex;
      gap: 2px;
      flex-wrap: nowrap;
    }

    .ch {
      min-width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      font-family: 'Courier New', Courier, monospace;
      font-size: .82rem;
      font-weight: 800;
    }

    .ch.match    { background: rgba(16,185,129,.15);  color: #059669; border: 1.5px solid rgba(16,185,129,.3); }
    .ch.mismatch { background: rgba(245,158,11,.15);  color: #d97706; border: 1.5px solid rgba(245,158,11,.3); }
    .ch.gap      { background: rgba(239,68,68,.1);    color: #dc2626; border: 1.5px solid rgba(239,68,68,.2); }

    /* symbols row */
    .ch.sym      { background: transparent; border: none; font-size: 1rem; }
    .ch.sym.match    { color: #059669; }
    .ch.sym.mismatch { color: #d97706; }
    .ch.sym.gap      { color: var(--text-muted); }

    /* ══════════════════════════════════════════
       ANIMATIONS
    ══════════════════════════════════════════ */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim-in { animation: slideUp .4s ease forwards; }

    /* ══════════════════════════════════════════
       FOOTER
    ══════════════════════════════════════════ */
    .site-footer {
      text-align: center;
      padding: 1.25rem 1rem;
      font-size: .8rem;
      font-weight: 700;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    .site-footer span { color: rgba(var(--accent-rgb), 1); }

    /* ══════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════ */
    @media (max-width: 580px) {
      .seq-grid   { grid-template-columns: 1fr; }
      .score-grid { grid-template-columns: 1fr; }
      .brand-text h1 { font-size: 1.05rem; }
      .card { padding: 1.25rem; }
      .score-value { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header class="site-header">
  <div class="brand">
    <span class="brand-icon">🧬</span>
    <div class="brand-text">
      <h1>NW Aligner</h1>
      <p>Needleman-Wunsch · Global Sequence Alignment</p>
    </div>
  </div>

  <div class="header-controls">
    <!-- Color picker -->
    <div class="color-wrap" title="Change accent colour">
      <button class="ctrl-btn" aria-label="Pick accent colour">🎨</button>
      <input type="color" id="colorPicker" value="#7c3aed" aria-label="Accent colour" />
    </div>

    <!-- Theme toggle -->
    <button class="ctrl-btn" id="themeBtn" aria-label="Toggle dark / light mode" title="Toggle theme">
      🌙
    </button>
  </div>
</header>

<!-- ═══════════ MAIN ═══════════ -->
<main>

  <!-- ── Input Card ── -->
  <section class="card">
    <h2 class="card-title"><span class="ti">⚙️</span> Configure Your Alignment</h2>

    <div class="seq-grid">
      <div class="field-group">
        <label class="field-label" for="seqA">🧪 Sequence A</label>
        <input
          type="text" id="seqA" class="field-input"
          placeholder="e.g. GATTACA" maxlength="30"
          autocomplete="off" spellcheck="false"
        />
      </div>
      <div class="field-group">
        <label class="field-label" for="seqB">🔬 Sequence B</label>
        <input
          type="text" id="seqB" class="field-input"
          placeholder="e.g. GCATGCU" maxlength="30"
          autocomplete="off" spellcheck="false"
        />
      </div>
    </div>

    <div class="score-grid">
      <div class="field-group">
        <label class="field-label" for="matchScore">✅ Match Score</label>
        <input type="number" id="matchScore" class="score-field" value="1" step="1" />
      </div>
      <div class="field-group">
        <label class="field-label" for="mismatchPen">❌ Mismatch Penalty</label>
        <input type="number" id="mismatchPen" class="score-field" value="-1" step="1" />
      </div>
      <div class="field-group">
        <label class="field-label" for="gapPen">〰️ Gap Penalty</label>
        <input type="number" id="gapPen" class="score-field" value="-2" step="1" />
      </div>
    </div>

    <p class="seq-type-badge">🔬 Supports DNA · RNA · Amino Acid sequences (any letters A–Z)</p>

    <button class="align-btn" id="alignBtn">
      <span>🚀</span> Run Alignment
    </button>
  </section>

  <!-- ── Error ── -->
  <div id="errorBox" class="error-box hidden" role="alert">
    <span>⚠️</span>
    <span id="errorMsg"></span>
  </div>

  <!-- ── Loading ── -->
  <div id="loadingWrap" class="loading-wrap hidden" aria-live="polite">
    <div class="spinner"></div>
    <span>Crunching the matrix… 🔢</span>
  </div>

  <!-- ── Matrix Card ── -->
  <section class="card hidden" id="matrixCard">
    <h2 class="card-title"><span class="ti">📊</span> Scoring Matrix</h2>
    <div class="matrix-scroll">
      <table class="nw-table" id="nwTable"></table>
    </div>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot ld-path"></div>
        <span>Traceback Path</span>
      </div>
    </div>
  </section>

  <!-- ── Results Card ── -->
  <section class="card hidden" id="resultsCard">
    <h2 class="card-title"><span class="ti">🏆</span> Alignment Results</h2>

    <div class="score-hero">
      <div>
        <div class="score-label">Final Alignment Score</div>
        <div class="score-value" id="finalScore">—</div>
      </div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="align-display" id="alignDisplay"></div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot ld-match"></div><span>Match</span></div>
      <div class="legend-item"><div class="legend-dot ld-mismatch"></div><span>Mismatch</span></div>
      <div class="legend-item"><div class="legend-dot ld-gap"></div><span>Gap (—)</span></div>
    </div>
  </section>

</main>

<!-- ═══════════ FOOTER ═══════════ -->
<footer class="site-footer">
  &copy; <span>acecodes2026</span>
</footer>

<!-- ═══════════ JAVASCRIPT ═══════════ -->
<script>
  /* ─────────────────────────────────────────
     THEME
  ───────────────────────────────────────── */
  const themeBtn = document.getElementById('themeBtn');
  let dark = localStorage.getItem('nw-theme') === 'dark';

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    themeBtn.textContent = dark ? '☀️' : '🌙';
  }
  applyTheme();

  themeBtn.addEventListener('click', () => {
    dark = !dark;
    localStorage.setItem('nw-theme', dark ? 'dark' : 'light');
    applyTheme();
  });

  /* ─────────────────────────────────────────
     ACCENT COLOR
  ───────────────────────────────────────── */
  const colorPicker = document.getElementById('colorPicker');

  function hexToRgbStr(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `${r}, ${g}, ${b}`;
  }

  function applyAccent(hex) {
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-rgb', hexToRgbStr(hex));
  }

  const savedAccent = localStorage.getItem('nw-accent');
  if (savedAccent) {
    colorPicker.value = savedAccent;
    applyAccent(savedAccent);
  }

  colorPicker.addEventListener('input', e => {
    applyAccent(e.target.value);
    localStorage.setItem('nw-accent', e.target.value);
  });

  /* ─────────────────────────────────────────
     UTILITY — auto-uppercase sequences
  ───────────────────────────────────────── */
  ['seqA', 'seqB'].forEach(id => {
    document.getElementById(id).addEventListener('input', e => {
      const pos = e.target.selectionStart;
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
      e.target.setSelectionRange(pos, pos);
    });
  });

  /* Enter key triggers alignment from any input */
  ['seqA', 'seqB', 'matchScore', 'mismatchPen', 'gapPen'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') runAlignment();
    });
  });

  /* ─────────────────────────────────────────
     HELPERS — show / hide UI pieces
  ───────────────────────────────────────── */
  const $ = id => document.getElementById(id);

  function showError(msg) {
    $('errorMsg').textContent = msg;
    $('errorBox').classList.remove('hidden');
  }
  function hideError()   { $('errorBox').classList.add('hidden'); }

  function showLoading() {
    $('loadingWrap').classList.remove('hidden');
    $('alignBtn').disabled = true;
  }
  function hideLoading() {
    $('loadingWrap').classList.add('hidden');
    $('alignBtn').disabled = false;
  }

  function hideResults() {
    $('matrixCard').classList.add('hidden');
    $('resultsCard').classList.add('hidden');
  }

  /* ─────────────────────────────────────────
     MAIN — fetch & render
  ───────────────────────────────────────── */
  $('alignBtn').addEventListener('click', runAlignment);

  async function runAlignment() {
    hideError();
    hideResults();
    showLoading();

    const payload = {
      seq_a:    $('seqA').value.trim(),
      seq_b:    $('seqB').value.trim(),
      match:    $('matchScore').value,
      mismatch: $('mismatchPen').value,
      gap:      $('gapPen').value,
    };

    try {
      const res  = await fetch('/align', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const data = await res.json();

      hideLoading();

      if (!res.ok) {
        showError(data.error || 'An unexpected error occurred.');
        return;
      }

      renderMatrix(data);
      renderResults(data);

    } catch {
      hideLoading();
      showError('Network error — is the Flask server running? 🖥️');
    }
  }

  /* ─────────────────────────────────────────
     RENDER MATRIX
  ───────────────────────────────────────── */
  function renderMatrix({ matrix, path, seq_a, seq_b }) {
    const table = $('nwTable');
    table.innerHTML = '';

    const n = seq_a.length;
    const m = seq_b.length;

    /* Build path set for O(1) lookup: "i,j" */
    const pathSet = new Set(path.map(([r, c]) => `${r},${c}`));

    /* ── thead: [corner] [—] [B₀] [B₁] … [Bₘ₋₁] */
    const thead = table.createTHead();
    const hRow  = thead.insertRow();

    const corner = document.createElement('th');
    corner.className = 'th-corner';
    hRow.appendChild(corner);

    /* above gap column */
    mkTh(hRow, '—', 'th-seq');

    for (const ch of seq_b) mkTh(hRow, ch, 'th-seq');

    /* ── tbody: row labels + DP values */
    const tbody = table.createTBody();

    for (let i = 0; i <= n; i++) {
      const tr = tbody.insertRow();

      /* row label: "—" for i=0, else seq_a[i-1] */
      const lbl = document.createElement('td');
      lbl.className = 'td-row-label';
      lbl.textContent = i === 0 ? '—' : seq_a[i - 1];
      tr.appendChild(lbl);

      for (let j = 0; j <= m; j++) {
        const td = document.createElement('td');
        td.className = 'td-cell';
        td.textContent = matrix[i][j];

        if (pathSet.has(`${i},${j}`)) {
          td.classList.add('td-path');
          if (i === 0 && j === 0) td.classList.add('td-origin');
        }

        tr.appendChild(td);
      }
    }

    const card = $('matrixCard');
    card.classList.remove('hidden');
    card.classList.add('anim-in');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function mkTh(row, text, cls) {
    const th = document.createElement('th');
    th.className = cls;
    th.textContent = text;
    row.appendChild(th);
  }

  /* ─────────────────────────────────────────
     RENDER RESULTS
  ───────────────────────────────────────── */
  function renderResults({ aligned_a, aligned_b, score }) {
    /* Score */
    $('finalScore').textContent = score >= 0 ? `+${score}` : score;

    /* Stats */
    let matches = 0, mismatches = 0, gaps = 0;
    for (let i = 0; i < aligned_a.length; i++) {
      const a = aligned_a[i], b = aligned_b[i];
      if (a === '-' || b === '-') gaps++;
      else if (a === b)           matches++;
      else                        mismatches++;
    }
    const ident = ((matches / aligned_a.length) * 100).toFixed(1);

    $('statsRow').innerHTML = `
      <div class="stat-chip">
        <div class="stat-num">${aligned_a.length}</div>
        <div class="stat-lbl">Length</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" style="color:#059669">${matches}</div>
        <div class="stat-lbl">Matches</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" style="color:#d97706">${mismatches}</div>
        <div class="stat-lbl">Mismatches</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num" style="color:#dc2626">${gaps}</div>
        <div class="stat-lbl">Gaps</div>
      </div>
      <div class="stat-chip">
        <div class="stat-num">${ident}%</div>
        <div class="stat-lbl">Identity</div>
      </div>
    `;

    /* Alignment visualization */
    const aSpans   = buildCharSpans(aligned_a, aligned_b);
    const symSpans = buildSymSpans(aligned_a, aligned_b);
    const bSpans   = buildCharSpans(aligned_b, aligned_a);

    $('alignDisplay').innerHTML = `
      <div class="align-row">
        <span class="row-lbl">Seq A:</span>
        <div class="char-list">${aSpans}</div>
      </div>
      <div class="align-row">
        <span class="row-lbl"></span>
        <div class="char-list">${symSpans}</div>
      </div>
      <div class="align-row">
        <span class="row-lbl">Seq B:</span>
        <div class="char-list">${bSpans}</div>
      </div>
    `;

    const card = $('resultsCard');
    card.classList.remove('hidden');
    card.classList.add('anim-in');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function charClass(ch, other) {
    if (ch === '-' || other === '-') return 'gap';
    return ch === other ? 'match' : 'mismatch';
  }

  function buildCharSpans(seq, other) {
    return [...seq].map((ch, i) =>
      `<span class="ch ${charClass(ch, other[i])}">${ch}</span>`
    ).join('');
  }

  function buildSymSpans(a, b) {
    return [...a].map((ch, i) => {
      if (ch === '-' || b[i] === '-') return `<span class="ch sym gap"> </span>`;
      if (ch === b[i])                return `<span class="ch sym match">|</span>`;
      return                                  `<span class="ch sym mismatch">·</span>`;
    }).join('');
  }
</script>
</body>
</html>
